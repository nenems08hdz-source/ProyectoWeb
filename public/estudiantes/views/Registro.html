<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - GEUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-center text-blue-600">Registro de Usuario</h2>

        <form action="/api/estudiantes/Registro.php" method="POST" class="space-y-6 mt-6">

            <div>
                <label for="correo" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                <input id="correo" name="correo" type="email" required
                       class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="contrasena" class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input id="contrasena" name="contrasena" type="password" required
                       class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Selector de Rol -->
            <div>
                <label for="rol" class="block text-sm font-medium text-gray-700">Selecciona tu rol</label>
                <select id="rol" name="rol" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- Seleccionar --</option>
                    <option value="Alumno">Alumno</option>
                    <option value="Asesor">Asesor</option>
                </select>
            </div>

            <button type="submit"
                    class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                Registrarse
            </button>
        </form>
    </div>
</body>
</html>
