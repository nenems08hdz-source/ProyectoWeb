<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEUT - Perfil</title>
  
    <link rel="stylesheet" href="Perfil.css"> 
   
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="logo">
                
                <i class="fas fa-graduation-cap"></i>
                <span>GEUT</span>
            </div>
            <nav class="nav-menu">
                
                <a href="Pantallaprincipal.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    Inicio
                </a>
                <a href="Anteproyecto.html" class="nav-item">
                    <i class="fas fa-file-alt"></i>
                    Anteproyecto
                </a>
                <a href="Estadia.html" class="nav-item">
                    <i class="fas fa-briefcase"></i>
                    Mi estadía
                </a>
                <a href="Comentarios.html" class="nav-item">
                    <i class="fas fa-comments"></i>
                    Comentarios
                </a>
               
                <a href="Perfil.html" class="nav-item active">
                    <i class="fas fa-user-circle"></i>
                    Perfil
                </a>
                <a href="Calendario.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    Calendario
                </a>
            </nav>
        </aside>

        <main class="main-content">
            
      
            <div class="card profile-card">
                
             
                <div class="profile-header">
                    <h2>Perfil</h2>
                </div>
                
                <div class="profile-body">
                    <p class="edit-info-title">Editar información de perfil</p>
                    
                    
                    <div class="profile-details-grid">
                        
                 
                        <div class="avatar-container">
                            <i class="fas fa-user-circle profile-avatar"></i>
                        </div>

                        <div class="profile-form-fields">
                       
                            <div class="form-group-full">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre">
                            </div>
                            
                           
                            <div class="form-group-full">
                                <label for="ap-paterno">Apellido paterno</label>
                                <input type="text" id="ap-paterno">
                            </div>

                            <div class="form-group-full">
                                <label for="ap-materno">Apellido materno</label>
                                <input type="text" id="ap-materno">
                            </div>

                           
                            <div class="form-group-full">
                                <label for="matricula">Matrícula</label>
                                <input type="text" id="matricula">
                            </div>
                            <div class="form-group-full">
                                <label for="Grupo">Grupo</label>
                                <input type="text" id="Grupo">
                            </div>
                            <div class="form-group-full">
                                <label for="Especialidad">Especialidad</label>
                                <input type="text" id="Especialidad">
                            </div>
                            <div class="save-button-container">
                        <button type="submit" id="guardar" class="save-button">
                            Guardar
                        </button>
                    </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
