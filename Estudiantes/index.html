<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEUT - Inicio de Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-2xl border border-blue-100">
        <div class="text-center">
            <i class="fas fa-graduation-cap mx-auto text-blue-600 text-4xl"></i>
            <h2 class="mt-4 text-3xl font-extrabold text-gray-900">Iniciar Sesión en GEUT</h2>
            <p class="mt-2 text-sm text-gray-600">Ingresa tu correo y contraseña para acceder al dashboard.</p>
        </div>

        <!-- Formulario que envía datos al script de LOGIN -->
        <form class="space-y-6" action="Login.php" method="POST">
            <div>
                <label for="correo" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                <div class="mt-1">
                    <input id="correo" name="correo" type="email" autocomplete="email" required
                        class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="tu-correo@ut.edu.mx">
                </div>
            </div>

            <div>
                <label for="contrasena" class="block text-sm font-medium text-gray-700">Contraseña</label>
                <div class="mt-1">
                    <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required
                        class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Contraseña">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Iniciar Sesión
                </button>
            </div>
        </form>

        <p class="text-center text-sm">
            ¿No tienes cuenta?
            <a href="Registro.html" class="font-medium text-blue-600 hover:text-blue-500">Regístrate aquí</a>
        </p>
    </div>
</body>
</html>
