    <script>
  document.getElementById('division').addEventListener('change', function() {
    const divisionId = this.value;
    const carreraSelect = document.getElementById('carrera');

    if (!divisionId) {
      carreraSelect.innerHTML = '<option value="">-- Selecciona una carrera --</option>';
      carreraSelect.disabled = true;
      return;
    }

    fetch('carreras.php?division_id=' + divisionId)
      .then(response => response.json())
      .then(data => {
        carreraSelect.innerHTML = '<option value="">-- Selecciona una carrera --</option>';
        data.forEach(carrera => {
          carreraSelect.innerHTML += `<option value="${carrera.id}">${carrera.nombre}</option>`;
        });
        carreraSelect.disabled = false;
      })
      .catch(error => {
        console.error('Error cargando carreras:', error);
      });
  });
  
      fetch('municipio.php')
      .then(function(response) {
        return response.json();
      })
      .then(function(municipio) {
        var select = document.getElementById('municipio');
        select.innerHTML = '<option value="">-- Selecciona un municipio --</option>';
        municipio.forEach(function(m) {
          select.innerHTML += '<option value="' + m.id + '">' + m.nombre + '</option>';
        });
      })
      .catch(function(error) {
        console.error('Error cargando municipio:', error);
      });
      document.getElementById("municipio").addEventListener("change", function() {
        const MunicipioID = this.value;
        fetch("colonia.php?municipio_id=" + encodeURIComponent(MunicipioID))
        .then(response => response.json())
        .then(data => {
          const coloniaSelect = document.getElementById("colonia");
          coloniaSelect.innerHTML = '<option disabled selected>Selecciona una colonia</option>';
          data.forEach(col => {
            const option = document.createElement("option");
           option.value = col.id;
           option.textContent = col.nombre;
            coloniaSelect.appendChild(option);
          });
         });
      });

</script>
